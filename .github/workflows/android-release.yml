name: Build, test and publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore fixed signing key
        env:
          PDFCRAFT_SIGNING_BUNDLE: ${{ secrets.PDFCRAFT_SIGNING_BUNDLE }}
        run: python3 tools/prepare_signing.py --restore "$RUNNER_TEMP/pdfcraft-signing/key.p12"
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and validate
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          PDFCRAFT_SIGNING_REQUIRED: 'true'
        run: |
          python3 -m unittest discover -s tools -p 'test_prepare_signing.py'
          ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PDFCraft.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/PDFCraft.apk > "$RUNNER_TEMP/apk-certificate.txt"
          python3 - <<'PY'
          import os, pathlib, re
          report = pathlib.Path(os.environ['RUNNER_TEMP'], 'apk-certificate.txt').read_text()
          expected = pathlib.Path('config/signing-certificate.sha256').read_text().strip()
          actual = re.findall(r'Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)', report)
          if actual != [expected]:
              raise SystemExit('APK certificate mismatch: refusing to publish.')
          PY
          cp config/signing-certificate.sha256 dist/SIGNING_CERT_SHA256.txt
          cd dist
          sha256sum PDFCraft.apk > SHA256SUMS.txt
      - name: Publish current build in Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/PDFCraft.apk dist/SHA256SUMS.txt dist/SIGNING_CERT_SHA256.txt \
            --target "$COMMIT" --latest \
            --title "PDFCraft Android · Build ${{ github.run_number }}" \
            --notes "Automatisch gebauter, entwicklersignierter Reader für Android 8.0+. Quellstand: $COMMIT. Unit-Tests und Android Lint erfolgreich. APK herunterladen und auf dem Smartphone installieren. Noch keine vollständige PdfCraft-Portierung."
      - name: Store test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: app/build/reports/
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pdfcraft-signing/key.p12"
