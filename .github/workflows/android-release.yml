name: Build, test and publish APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - uses: gradle/actions/setup-gradle@v4
      # Reuse the same developer signing key so preview updates remain installable.
      - name: Restore preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pdfcraft-preview-signing-v1
      - name: Build and validate
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PDFCraft.apk
          cd dist
          sha256sum PDFCraft.apk > SHA256SUMS.txt
      - name: Publish current build in Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          COMMIT: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/PDFCraft.apk dist/SHA256SUMS.txt \
            --target "$COMMIT" --latest \
            --title "PDFCraft Android · Build ${{ github.run_number }}" \
            --notes "Automatisch gebauter, entwicklersignierter Reader für Android 8.0+. Quellstand: $COMMIT. Unit-Tests und Android Lint erfolgreich. APK herunterladen und auf dem Smartphone installieren. Noch keine vollständige PdfCraft-Portierung."
      - name: Store test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: app/build/reports/
